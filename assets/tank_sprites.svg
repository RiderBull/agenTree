<svg width="256" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Tank body orientations: front, right, back, left -->
  <g id="tank_front" transform="translate(0,0)">
    <rect x="10" y="20" width="40" height="20" fill="#4A90E2" stroke="#000" stroke-width="2"/>
    <rect x="25" y="10" width="10" height="20" fill="#357ABD" stroke="#000" stroke-width="2"/>
  </g>
  <g id="tank_right" transform="translate(64,0)">
    <rect x="10" y="20" width="40" height="20" fill="#4A90E2" stroke="#000" stroke-width="2"/>
    <rect x="40" y="15" width="20" height="10" fill="#357ABD" stroke="#000" stroke-width="2"/>
  </g>
  <g id="tank_back" transform="translate(128,0)">
    <rect x="10" y="20" width="40" height="20" fill="#4A90E2" stroke="#000" stroke-width="2"/>
    <rect x="25" y="30" width="10" height="20" fill="#357ABD" stroke="#000" stroke-width="2"/>
  </g>
  <g id="tank_left" transform="translate(192,0)">
    <rect x="10" y="20" width="40" height="20" fill="#4A90E2" stroke="#000" stroke-width="2"/>
    <rect x="-10" y="15" width="20" height="10" fill="#357ABD" stroke="#000" stroke-width="2"/>
  </g>
  <!-- Damaged state overlay -->
  <g id="damaged_overlay" fill="red" opacity="0.5">
    <rect x="10" y="20" width="40" height="20" />
  </g>
</svg>